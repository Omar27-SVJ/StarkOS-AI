
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EgoSync | Tactical HUD Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hologram-cyan: #00f2ff;
            --hologram-blue: #0062ff;
            --hologram-glow: rgba(0, 242, 255, 0.3);
            --stark-red: #ff3c3c;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #020617;
            color: var(--hologram-cyan);
            overflow: hidden;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 242, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 242, 255, 0.05);
        }
        .hud-border {
            position: relative;
        }
        .hud-border::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid var(--hologram-cyan);
            border-left: 2px solid var(--hologram-cyan);
        }
        .hud-border::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; width: 10px; height: 10px;
            border-bottom: 2px solid var(--hologram-cyan);
            border-right: 2px solid var(--hologram-cyan);
        }
        
        @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotate-fast { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.9; }
            10% { opacity: 1; }
            15% { opacity: 0.85; }
            25% { opacity: 0.95; }
            30% { opacity: 1; }
            100% { opacity: 1; }
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--hologram-cyan), transparent);
            position: absolute;
            opacity: 0.1;
            animation: scanline 4s linear infinite;
            z-index: 50;
            pointer-events: none;
        }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .avatar-ring {
            border: 1px dashed var(--hologram-cyan);
            border-radius: 50%;
            position: absolute;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--hologram-cyan); border-radius: 2px; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="grid-bg">
    <div class="scanline"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
